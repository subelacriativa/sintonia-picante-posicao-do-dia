<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sintonia Picante - Posição do Dia</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #1a0813 0%, #3a001a 100%);
color: #fff;
min-height: 100vh;
margin: 0;
display: flex;
flex-direction: column;
align-items: center;
padding: 20px;
box-sizing: border-box;
}
h1 { color: #ff3366; text-align: center; text-shadow: 0 0 10px rgba(255,51,102,0.5); font-size: 24px; margin-bottom: 5px; }
h3 { margin: 10px 0 5px 0; color: #ff8fa3; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
p { color: #cccccc; text-align: center; font-size: 14px; margin-top: 5px; }
.card {
background: rgba(255, 255, 255, 0.05);
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 51, 102, 0.2);
border-radius: 20px;
padding: 25px;
width: 100%;
max-width: 400px;
box-sizing: border-box;
text-align: center;
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}
.btn {
background: linear-gradient(90deg, #ff3366, #ff0044);
color: white; border: none; padding: 14px 30px;
font-size: 16px; font-weight: bold; border-radius: 25px;
cursor: pointer; margin: 20px 0 10px 0; width: 100%;
box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
transition: 0.2s;
text-transform: uppercase;
letter-spacing: 1px;
}
.btn:hover {
transform: scale(1.02);
box-shadow: 0 6px 20px rgba(255, 51, 102, 0.6);
}
.btn:disabled { background: #444; box-shadow: none; cursor: not-allowed; transform: none; }

/* Ilustração/Container da Posição */
.posicao-container {
width: 140px; height: 140px; margin: 20px auto;
border: 2px dashed rgba(255, 51, 102, 0.4);
border-radius: 50%; position: relative;
background: rgba(0,0,0,0.3);
display: flex; flex-direction: column; justify-content: center; align-items: center;
box-shadow: inset 0 0 20px rgba(255, 51, 102, 0.2);
}
.icone-posicao { font-size: 65px; animation: pulsar 2.5s infinite alternate; }

@keyframes pulsar {
from { transform: scale(0.95); filter: drop-shadow(0 0 5px rgba(255,51,102,0.4)); }
to { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(255,51,102,0.8)); }
}

/* Informações do Catálogo */
.foguinhos { font-size: 22px; margin: 10px 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
.titulo-posicao { font-size: 22px; font-weight: bold; color: #fff; margin: 5px 0; }
.instrucoes-box {
background: rgba(255, 255, 255, 0.07);
border-radius: 12px;
padding: 15px;
text-align: left;
margin-top: 15px;
border-left: 4px solid #ff3366;
font-size: 13.5px;
line-height: 1.5;
color: #e0e0e0;
}
.contador-catalogo {
font-size: 11px; color: #ff8fa3; margin-top: 15px; opacity: 0.6; font-weight: bold;
}
.tag-tempo {
background: rgba(255, 51, 102, 0.2);
color: #ff8fa3;
padding: 5px 12px;
border-radius: 15px;
font-size: 11px;
display: inline-block;
font-weight: bold;
margin-bottom: 10px;
border: 1px solid rgba(255, 51, 102, 0.4);
}
</style>
</head>
<body>

<div class="card">
    <h1>Sintonia Picante 🔥</h1>
    <p>Sua dose diária de intimidade e novidade</p>
    
    <hr style="border: 0; border-top: 1px solid rgba(255,51,102,0.2); margin: 15px 0;">
    
    <div class="tag-tempo" id="data-atual">DESAFIO DAS PRÓXIMAS 24H</div>
    
    <div class="posicao-container">
        <div class="icone-posicao" id="posicao-emoji">🧘‍♀️</div>
    </div>
    
    <div class="foguinhos" id="posicao-dificuldade">🔥🔥🔥</div>
    
    <div class="titulo-posicao" id="posicao-nome">Carrossel</div>
    <h3>Kama Sutra</h3>
    
    <div class="instrucoes-box" id="posicao-instrucoes">
        Carregando instruções secretas...
    </div>
    
    <button class="btn" id="btn-aceitar" onclick="aceitarDesafio()">Aceitar Desafio 😈</button>
    
    <div class="contador-catalogo" id="posicao-index">POSIÇÃO 1 DE 120</div>
</div>

<script>
// Catálogo expansível até 120 posições (Exemplos estruturados prontos para expansão)
const catalogoPosicoes = [
    {
        nome: "A Ponte do Desejo",
        emoji: "🧎‍♂️",
        dificuldade: "🔥🔥",
        instrucoes: "O parceiro ativo fica de joelhos enquanto o parceiro receptor deita de costas, elevando o quadril com o apoio de almofadas firmes. Esta posição do Kama Sutra maximiza o contato visual e permite carícias suaves por todo o corpo durante o movimento."
    },
    {
        nome: "O Lótus Suspenso",
        emoji: "🧘‍♂️",
        dificuldade: "🔥🔥🔥🔥",
        instrucoes: "Um dos parceiros senta-se de pernas cruzadas (posição de lótus) e o outro senta-se no colo dele, envolvendo a cintura com as pernas. Exige força e equilíbrio, promovendo uma conexão íntima, olho no olho, extremamente intensa e profunda."
    },
    {
        nome: "A Flecha de Cupido",
        emoji: "🤸‍♀️",
        dificuldade: "🔥🔥🔥",
        instrucoes: "O parceiro receptor deita de costas de lado na cama, esticando uma das pernas para cima enquanto a outra serve de apoio. O parceiro ativo se aproxima de joelhos. Uma excelente opção para focar em estímulos lentos, profundos e prazerosos."
    },
    {
        nome: "O Tigre Agachado",
        emoji: "🐅",
        dificuldade: "🔥",
        instrucoes: "Uma variação confortável e altamente estimulante do clássico de quatro. O parceiro receptor apoia o peito e os braços completamente colados nos lençóis (com o quadril levemente elevado), enquanto o parceiro ativo se posiciona logo atrás de joelhos."
    },
    {
        nome: "União do Bambu",
        emoji: "🎋",
        dificuldade: "🔥🔥🔥🔥🔥",
        instrucoes: "Ambos ficam em pé. O parceiro receptor eleva uma das pernas prendendo-a ao redor da cintura do parceiro ativo, que oferece o suporte e sustentação. Exige bastante sincronia física, sendo ideal para quebrar a rotina fora do quarto."
    }
    // Nota: Você pode continuar adicionando objetos aqui até completar as 120 opções do catálogo!
];

// Função baseada em tempo para gerar o mesmo index estável durante as 24h do dia atual
function obterPosicaoDoDia() {
    const hoje = new Date();
    // Cria um número único usando o Ano, Mês e Dia corrente
    const sementeData = hoje.getFullYear() * 10000 + (hoje.getMonth() + 1) * 100 + hoje.getDate();
    
    // O operador Resto (%) garante que o índice rotacione perfeitamente dentro do tamanho real do catálogo
    const indice = sementeData % catalogoPosicoes.length;
    
    return {
        posicao: catalogoPosicoes[indice],
        numeroReal: indice + 1
    };
}

function renderizarPosicao() {
    const dadosDoDia = obterPosicaoDoDia();
    const pos = dadosDoDia.posicao;
    
    // Atualiza os elementos da tela
    document.getElementById("posicao-nome").innerText = pos.nome;
    document.getElementById("posicao-emoji").innerText = pos.emoji;
    document.getElementById("posicao-dificuldade").innerText = pos.dificuldade;
    document.getElementById("posicao-instrucoes").innerText = pos.instrucoes;
    document.getElementById("posicao-index").innerText = `POSIÇÃO ${dadosDoDia.numeroReal} DE ${catalogoPosicoes.length} DO CATÁLOGO`;
    
    // Formata exibição da data local de validade do desafio
    const hoje = new Date();
    const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
    document.getElementById("data-atual").innerText = `DESAFIO DE HOJE • ${hoje.toLocaleDateString('pt-BR', options)}`;
}

function aceitarDesafio() {
    // Desativa o botão temporariamente celebrando a escolha do casal
    const btn = document.getElementById("btn-aceitar");
    btn.disabled = true;
    btn.innerText = "Desafio Aceito! 😏";
    
    // Feedback tátil (se disponível em smartphones)
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    
    // Efeito visual festivo e romântico
    dispararConfetesSafados();
}

function dispararConfetesSafados() {
    const duration = 2.5 * 1000;
    const end = Date.now() + duration;
    (function frame() {
        // Paleta de cores combinando com o Sintonia Picante (Rosas, Roxos e Branco)
        confetti({ particleCount: 4, angle: 60, spread: 60, origin: { x: 0, y:0.8 }, colors: ['#ff3366', '#ffffff', '#be2edd'] });
        confetti({ particleCount: 4, angle: 120, spread: 60, origin: { x: 1, y:0.8 }, colors: ['#ff3366', '#ffffff', '#be2edd'] });
        if (Date.now() < end) requestAnimationFrame(frame);
    }());
}

// Inicializa a renderização assim que a página carregar
window.onload = renderizarPosicao;
</script>

</body>
</html>
